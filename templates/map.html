<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trajet: {{ route.origin }} → {{ route.dest }}</title>
    
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #info-box {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 300px;
        }
        h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        p { margin: 5px 0; font-size: 14px; color: #555; }
        .badge { font-weight: bold; color: #007cbf; }
    </style>
</head>
<body>

    <div id="info-box">
        <h3>{{ route.origin }} ➔ {{ route.dest }}</h3>
        <p>Distance : <span class="badge" id="dist">{{ route.distance_km }} km</span></p>
        <p>Durée : <span class="badge" id="dur">{{ route.duration_h }} h</span></p>
        <p>Péage : <span class="badge" id="toll">{{ route.prix_peage }} €</span></p>
    </div>

    <div id="map"></div>

    <script>
        // Récupération des données envoyées par Python
        const routeId = "{{ route_id }}";
        const serverUrl = "{{ server_url }}";
        // La polyline Python est [[lat, lng], ...], MapLibre utilise [[lng, lat], ...]
        let pythonCoords = {{ route.polyline | tojson }};
        let geojsonCoords = pythonCoords.map(c => [c[1], c[0]]);

        const startCoord = geojsonCoords[0];
        const endCoord = geojsonCoords[geojsonCoords.length - 1];

        // Initialisation de MapLibre
        const map = new maplibregl.Map({
            container: 'map',
            // Fond de carte gratuit et épuré (Carto Voyager)
            style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
            center: startCoord,
            zoom: 5
        });

        // Ajout des contrôles de navigation (Zoom, rotation)
        map.addControl(new maplibregl.NavigationControl());

        let originMarker, destMarker;

        map.on('load', () => {
            // 1. Ajouter la source de données pour le tracé
            map.addSource('routeSource', {
                'type': 'geojson',
                'data': {
                    'type': 'Feature',
                    'properties': {},
                    'geometry': {
                        'type': 'LineString',
                        'coordinates': geojsonCoords
                    }
                }
            });

            // 2. Ajouter la couche visuelle pour dessiner le tracé
            map.addLayer({
                'id': 'routeLayer',
                'type': 'line',
                'source': 'routeSource',
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                'paint': {
                    'line-color': '#007cbf', // Bleu
                    'line-width': 5,
                    'line-opacity': 0.8
                }
            });

            // Cadrer la carte sur l'ensemble du trajet
            const bounds = new maplibregl.LngLatBounds(geojsonCoords[0], geojsonCoords[0]);
            for (const coord of geojsonCoords) {
                bounds.extend(coord);
            }
            map.fitBounds(bounds, { padding: 50 });

            // 3. Ajouter les marqueurs déplaçables (Drag & Drop)
            originMarker = new maplibregl.Marker({ color: '#27ae60', draggable: true })
                .setLngLat(startCoord)
                .addTo(map);

            destMarker = new maplibregl.Marker({ color: '#c0392b', draggable: true })
                .setLngLat(endCoord)
                .addTo(map);

            // Écouter la fin du glissement pour recalculer
            originMarker.on('dragend', recalculateRoute);
            destMarker.on('dragend', recalculateRoute);
        });

        // Fonction de recalcul
        async function recalculateRoute() {
            const start = originMarker.getLngLat();
            const end = destMarker.getLngLat();

            // Mettre un petit indicateur visuel (opacité) pendant le calcul
            map.setPaintProperty('routeLayer', 'line-opacity', 0.3);

            try {
                const response = await fetch(`${serverUrl}/api/recalculate_drag`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        route_id: routeId,
                        waypoints: [
                            { lat: start.lat, lng: start.lng },
                            { lat: end.lat, lng: end.lng }
                        ]
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Mettre à jour les infos dans le panneau
                    document.getElementById('dist').innerText = data.distance_km + " km";
                    document.getElementById('dur').innerText = data.duration_h + " h";
                    document.getElementById('toll').innerText = data.prix_peage + " €";

                    // Convertir les nouvelles coordonnées et mettre à jour le tracé
                    geojsonCoords = data.polyline.map(c => [c[1], c[0]]);
                    map.getSource('routeSource').setData({
                        'type': 'Feature',
                        'properties': {},
                        'geometry': {
                            'type': 'LineString',
                            'coordinates': geojsonCoords
                        }
                    });
                } else {
                    alert("Erreur lors du recalcul PTV.");
                }
            } catch (err) {
                console.error(err);
                alert("Erreur de connexion au serveur.");
            } finally {
                // Remettre l'opacité normale
                map.setPaintProperty('routeLayer', 'line-opacity', 0.8);
            }
        }
    </script>
</body>
</html>
